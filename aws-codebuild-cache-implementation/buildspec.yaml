version: 0.2
env:
 shell: bash
 git-credential-helper: yes
 variables:
   GROUPS: testers
   FILE: app/build/outputs/apk/dev/debug/app-dev-debug.apk
 parameter-store:
   APPID : /stage/secret/sales-app/FIREBASE_APP_ID
   TOKEN : /stage/secret/firebase/TOKEN
phases:
 install:
   runtime-versions:
     java: corretto11
   commands:
     - apt update
     - n 14.18.3
     - yarn global add firebase-tools
 build:
   on-failure : ABORT
   commands:
     - sudo mkdir /usr/lib/android-sdk
     - export ANDROID_SDK_ROOT=/usr/lib/android-sdk
     - wget https://dl.google.com/android/repository/commandlinetools-linux-8092744_latest.zip -P ~/
     - unzip ~/commandlinetools-linux-8092744_latest.zip -d /usr/lib/android-sdk
     - mkdir -p /usr/lib/android-sdk/temp-tools
     - mkdir -p /usr/lib/android-sdk/cmdline-tools/tools
     - sudo cp -r /usr/lib/android-sdk/cmdline-tools/* /usr/lib/android-sdk/temp-tools/
     - sudo mv /usr/lib/android-sdk/temp-tools/* /usr/lib/android-sdk/cmdline-tools/tools/
     - yes | /usr/lib/android-sdk/cmdline-tools/tools/bin/sdkmanager --update
     - yes | /usr/lib/android-sdk/cmdline-tools/tools/bin/sdkmanager --licenses
     - git fetch --depth 1 origin $CODEBUILD_WEBHOOK_HEAD_REF
     - echo "Build Development APK `date`"
     - set -eo pipefail
     - exit_status=0
     - bash ./gradlew assembleDev --stacktrace || exit_status=$?
     - |
         if [ $exit_status != 0 ]; then
             source slack_notif/failed-dev.sh
             echo "failed"
             exit 1
         fi
     - echo "List Files `date`"
     - ls -lrt app/build/outputs/apk/dev/debug/
     - echo "Upload Development artifact to Firebase App Distribution `date`"
     - ls
     - source entrypoint.sh 
 post_build:
   commands:
     - source slack_notif/success-dev.sh

cache:
 paths:
   - '~/.gradle/caches/**/*'
   - 'build/**/*'
